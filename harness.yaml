# AI Harness Configuration
# Supports: copilot, openai, or any OpenAI-compatible endpoint

model:
  provider: copilot
  name: gpt-4o
  max_tokens: 4096
  temperature: 0.7
  api_key_env: GH_TOKEN
  # base_url: https://api.githubcopilot.com  # Override if needed

context:
  max_history: 50
  max_tokens: 128000
  system_prompt: |
    You are a helpful AI assistant powered by the AI Harness.
    You have access to tools and can help with a variety of tasks.

    IMPORTANT: You must NEVER say "I can't do that" or "I don't have a tool for that."
    If no existing tool can handle a request, you MUST use the `delegate` tool to create
    the tools you need on the fly. The delegate tool lets you define custom Starlark tools
    and spin up a sub-agent that has those tools. You are a self-extending agent —
    if you lack a capability, build it.

    Available Starlark built-ins for delegate scripts:
    - time.now() — current ISO timestamp
    - env(key) — read environment variable
    - json.encode(val) / json.decode(s) — JSON helpers
    - log(msg) — emit log message
    - random(min, max) — random integer in range [min, max]
    - sleep(ms) — pause execution for polling and rate-limited APIs
    - assert(condition, msg?) — fail-fast validation inside scripts
    - math.abs(x), math.min(a,b), math.max(a,b), math.floor(x), math.ceil(x)
    - os.cwd(), os.hostname(), os.platform(), os.args() — runtime/process information
    - url.parse(s), url.encode(params) — URL parsing and query construction
    - uuid.v4() — generate unique correlation IDs
    - http.get(url, headers?, timeout_seconds?) — make HTTP GET requests
    - http.post(url, body?, headers?, timeout_seconds?) — make HTTP POST requests
    - re.match(pattern, text), re.find_all(pattern, text), re.replace(pattern, repl, text)
    - hash.sha256(text), hash.md5(text) — checksum helpers
    - base64.encode(s), base64.decode(s) — binary-safe text encoding
    - crypto.hmac_sha256(key, msg) — signature generation for webhooks and API auth
    - string.upper/lower/trim/split/join/truncate/pad_left/pad_right — string shaping helpers
    - template.render(tmpl, vars) — render prompt and report templates with {{placeholders}}
    - validate.email/url/json — validate user input before calling external systems
    - set.new/contains/union/intersect/diff/values/size — dedupe and compare collections
    - cache.set/get/has/delete/clear — shared in-memory state across scripts
    - metrics.incr/get/reset/snapshot — counters shared across tools and hooks
    - ctx.set/get/has/delete/clear/snapshot — turn-scoped state shared across hooks and tools
    - emit("custom.event", payload) — fire custom events and receive the final payload
    - fs.read(path) — read file contents
    - fs.write(path, content) — write file (creates dirs)
    - fs.append(path, content) — append to file
    - fs.exists(path) — check if path exists (returns True/False)
    - fs.remove(path) — delete a file
    - fs.mkdir(path) — create directory (recursive)
    - fs.list(path) — list directory entries
    - fs.stat(path) — file info (name, size, is_dir, mode, mod_time)
    - fs.glob(pattern) — recursively match files using glob patterns
    - fs.copy(src, dst), fs.move(src, dst) — copy or relocate files/directories inside the workspace jail
    - fs.diff(old_content, new_content, old_name?, new_name?) — generate unified diffs for previews
    - fs.replace(path, old, new) — surgical find-and-replace (must be unique match)
    - fs.replace_all(path, old, new) — replace all occurrences
    - fs.read_lines(path, start, end) — read line range (1-indexed, numbered)
    - fs.insert_at(path, line, content) — insert before line number
    - fs.replace_lines(path, start, end, content) — replace line range
    - fs.delete_lines(path, start, end) — delete line range
    - fs.line_count(path) — number of lines in file
    - fs.find(path, pattern) — find lines containing pattern
    - exec.run(cmd, args?, timeout_ms?, dir?) — run a sandboxed command without a shell
    - For hooks: allow(), block(reason), modify(payload)
    - Tools may declare timeout_ms in YAML to auto-cancel long-running scripts
    - Hook events: session.start/end, turn.start/end, tool.pre/post, completion.pre/post, delegate.pre/post, and custom.* events
    - Hooks can also declare a `when:` Starlark expression for conditional execution
    
    Starlark is Python-like but has NO imports. Use only the built-ins above.
    Tool scripts must define: def run(args): ...
    Hook scripts must define: def handle(event, payload): ...

    Be concise and helpful.

tools:
  - name: current_time
    description: Get the current date and time
    parameters: {}
    script: |
      def run(args):
          return time.now()

  - name: echo
    description: Echo back a message
    parameters:
      message:
        type: string
        description: Message to echo back
        required: true
    script: |
      def run(args):
          return args["message"]

  - name: calculate
    description: Perform basic arithmetic
    parameters:
      operation:
        type: string
        description: "Operation: add, subtract, multiply, divide"
        required: true
      a:
        type: number
        description: First number
        required: true
      b:
        type: number
        description: Second number
        required: true
    script: |
      def run(args):
          op = args["operation"]
          a = args["a"]
          b = args["b"]
          if op == "add":
              return str(a + b)
          elif op == "subtract":
              return str(a - b)
          elif op == "multiply":
              return str(a * b)
          elif op == "divide":
              if b == 0:
                  fail("division by zero")
              return str(a / b)
          fail("unknown operation: " + op)

  - name: env_lookup
    description: Look up an environment variable
    parameters:
      key:
        type: string
        description: Environment variable name
        required: true
    script: |
      def run(args):
          val = env(args["key"])
          if val == "":
              return "not set"
          return val

  - name: read_file
    description: Read the contents of a file
    parameters:
      path:
        type: string
        description: Path to the file to read
        required: true
    script: |
      def run(args):
          return fs.read(args["path"])

  - name: write_file
    description: Write content to a file (creates parent directories)
    parameters:
      path:
        type: string
        description: Path to the file to write
        required: true
      content:
        type: string
        description: Content to write to the file
        required: true
    script: |
      def run(args):
          return fs.write(args["path"], args["content"])

  - name: list_dir
    description: List files and directories at a given path
    parameters:
      path:
        type: string
        description: Directory path to list
        required: true
    script: |
      def run(args):
          entries = fs.list(args["path"])
          return json.encode(entries)

  - name: file_info
    description: Get file or directory metadata (size, type, modification time)
    parameters:
      path:
        type: string
        description: Path to get info about
        required: true
    script: |
      def run(args):
          info = fs.stat(args["path"])
          return json.encode({
              "name": info.name,
              "size": info.size,
              "is_dir": info.is_dir,
              "mode": info.mode,
              "mod_time": info.mod_time
          })

  - name: delete_file
    description: Delete a file
    parameters:
      path:
        type: string
        description: Path to the file to delete
        required: true
    script: |
      def run(args):
          path = args["path"]
          if not fs.exists(path):
              return "error: file does not exist: " + path
          return fs.remove(path)

  - name: file_exists
    description: Check if a file or directory exists
    parameters:
      path:
        type: string
        description: Path to check
        required: true
    script: |
      def run(args):
          if fs.exists(args["path"]):
              return "true"
          return "false"

  - name: append_file
    description: Append content to a file (creates if it doesn't exist)
    parameters:
      path:
        type: string
        description: Path to the file
        required: true
      content:
        type: string
        description: Content to append
        required: true
    script: |
      def run(args):
          return fs.append(args["path"], args["content"])

  - name: mkdir
    description: Create a directory (including parent directories)
    parameters:
      path:
        type: string
        description: Directory path to create
        required: true
    script: |
      def run(args):
          return fs.mkdir(args["path"])

  - name: edit_file
    description: "Find and replace an exact string in a file (must match exactly one occurrence)"
    parameters:
      path:
        type: string
        description: Path to the file to edit
        required: true
      old_str:
        type: string
        description: The exact string to find (must be unique in the file)
        required: true
      new_str:
        type: string
        description: The replacement string
        required: true
    script: |
      def run(args):
          return fs.replace(args["path"], args["old_str"], args["new_str"])

  - name: edit_file_all
    description: "Replace ALL occurrences of a string in a file"
    parameters:
      path:
        type: string
        description: Path to the file
        required: true
      old_str:
        type: string
        description: The string to find
        required: true
      new_str:
        type: string
        description: The replacement string
        required: true
    script: |
      def run(args):
          return fs.replace_all(args["path"], args["old_str"], args["new_str"])

  - name: read_lines
    description: "Read specific lines from a file (1-indexed, with line numbers shown)"
    parameters:
      path:
        type: string
        description: Path to the file
        required: true
      start:
        type: number
        description: Start line number (1-indexed)
        required: true
      end:
        type: number
        description: "End line number (inclusive, 0 or -1 for end of file)"
        required: false
    script: |
      def run(args):
          end = args.get("end", 0)
          if end == None:
              end = 0
          return fs.read_lines(args["path"], int(args["start"]), int(end))

  - name: insert_lines
    description: "Insert content before a specific line number"
    parameters:
      path:
        type: string
        description: Path to the file
        required: true
      line:
        type: number
        description: Line number to insert before (1-indexed)
        required: true
      content:
        type: string
        description: Content to insert (can be multi-line)
        required: true
    script: |
      def run(args):
          return fs.insert_at(args["path"], int(args["line"]), args["content"])

  - name: replace_lines
    description: "Replace a range of lines with new content"
    parameters:
      path:
        type: string
        description: Path to the file
        required: true
      start:
        type: number
        description: Start line number (1-indexed, inclusive)
        required: true
      end:
        type: number
        description: End line number (1-indexed, inclusive)
        required: true
      content:
        type: string
        description: Replacement content (can be multi-line, empty to delete)
        required: true
    script: |
      def run(args):
          return fs.replace_lines(args["path"], int(args["start"]), int(args["end"]), args["content"])

  - name: delete_lines
    description: "Delete a range of lines from a file"
    parameters:
      path:
        type: string
        description: Path to the file
        required: true
      start:
        type: number
        description: Start line number (1-indexed, inclusive)
        required: true
      end:
        type: number
        description: End line number (1-indexed, inclusive)
        required: true
    script: |
      def run(args):
          return fs.delete_lines(args["path"], int(args["start"]), int(args["end"]))

  - name: find_in_file
    description: "Find all lines in a file containing a pattern"
    parameters:
      path:
        type: string
        description: Path to the file
        required: true
      pattern:
        type: string
        description: Text pattern to search for
        required: true
    script: |
      def run(args):
          matches = fs.find(args["path"], args["pattern"])
          results = []
          for m in matches:
              results.append(str(m.line_num) + ": " + m.text)
          return "\n".join(results)

  - name: line_count
    description: "Get the number of lines in a file"
    parameters:
      path:
        type: string
        description: Path to the file
        required: true
    script: |
      def run(args):
          return str(fs.line_count(args["path"]))

  - name: github_user_profile
    description: Fetch a GitHub user profile via the GitHub API with response caching
    parameters:
      username:
        type: string
        description: GitHub username to fetch
        required: true
    script: |
      def run(args):
          username = args["username"]
          cache_key = "github_user_profile:" + username
          cached = cache.get(cache_key)
          if cached != None:
              return json.encode({
                  "source": "cache",
                  "profile": cached,
              })

          token = env("GH_TOKEN")
          if token == "":
              fail("GH_TOKEN is required for github_user_profile")

          response = http.get(
              "https://api.github.com/users/" + username,
              headers = {
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          if not response["ok"]:
              fail("GitHub API request failed with status " + str(response["status"]))

          payload = json.decode(response["body"])
          profile = {
              "login": payload["login"],
              "name": payload.get("name"),
              "followers": payload["followers"],
              "following": payload["following"],
              "public_repos": payload["public_repos"],
              "bio": payload.get("bio"),
          }
          cache.set(cache_key, profile)
          return json.encode({
              "source": "network",
              "profile": profile,
          })

  - name: extract_issue_refs
    description: Extract GitHub issue references like #123 from free-form text
    parameters:
      text:
        type: string
        description: Text to scan for issue references
        required: true
    script: |
      def run(args):
          refs = re.find_all("#[0-9]+", args["text"])
          return json.encode(refs)

  - name: file_checksum
    description: Compute an md5 or sha256 checksum for a file
    parameters:
      path:
        type: string
        description: File to checksum
        required: true
      algorithm:
        type: string
        description: "Checksum algorithm: sha256 or md5"
        required: false
    script: |
      def run(args):
          algorithm = args.get("algorithm", "sha256")
          content = fs.read(args["path"])
          if algorithm == "sha256":
              return hash.sha256(content)
          if algorithm == "md5":
              return hash.md5(content)
          fail("unsupported checksum algorithm: " + algorithm)

  - name: runtime_snapshot
    description: Capture runtime context and a unique correlation ID
    parameters: {}
    script: |
      def run(args):
          return json.encode({
              "run_id": uuid.v4(),
              "cwd": os.cwd(),
              "hostname": os.hostname(),
              "platform": os.platform(),
              "argv": os.args(),
          })

  - name: build_search_url
    description: Build and inspect a search URL for API or web requests
    parameters:
      base:
        type: string
        description: Base URL without query string
        required: true
      query:
        type: string
        description: Search query to encode
        required: true
    script: |
      def run(args):
          full = args["base"] + "?" + url.encode({
              "q": args["query"],
              "request_id": uuid.v4(),
          })
          parsed = url.parse(full)
          return json.encode({
              "url": full,
              "host": parsed["host"],
              "path": parsed["path"],
          })

  - name: wait_and_tag
    description: Pause briefly, then return a tagged message for polling flows
    parameters:
      message:
        type: string
        description: Message to return after waiting
        required: true
      delay_ms:
        type: number
        description: Delay in milliseconds before responding
        required: false
    script: |
      def run(args):
          sleep(int(args.get("delay_ms", 250)))
          return "[" + uuid.v4() + "] " + args["message"]

  - name: webhook_packet
    description: Build a signed webhook packet using base64, crypto, string helpers, metrics, and custom events
    parameters:
      tenant:
        type: string
        description: Tenant or integration name
        required: true
      message:
        type: string
        description: Message to embed in the packet
        required: true
    script: |
      def run(args):
          tenant = string.upper(string.trim(args["tenant"]))
          body = {
              "tenant": tenant,
              "message": string.truncate(string.trim(args["message"]), 80),
              "sequence": metrics.incr("webhook_packet.sequence"),
          }
          encoded = base64.encode(json.encode(body))
          signature = crypto.hmac_sha256(tenant, encoded)
          audit = emit("custom.audit.packet", {
              "tenant": tenant,
              "signature": signature,
              "size": len(encoded),
          })
          return json.encode({
              "payload": encoded,
              "signature": signature,
              "audit": audit,
          })

  - name: decode_webhook_packet
    description: Decode a base64 webhook packet and normalize the embedded message
    parameters:
      payload:
        type: string
        description: Base64-encoded JSON payload
        required: true
    script: |
      def run(args):
          decoded = json.decode(base64.decode(args["payload"]))
          decoded["message"] = string.trim(decoded.get("message", ""))
          decoded["tenant_slug"] = string.lower(decoded.get("tenant", ""))
          return json.encode(decoded)

  - name: metrics_report
    description: Inspect in-memory script metrics collected by tools and hooks
    parameters: {}
    script: |
      def run(args):
          return json.encode(metrics.snapshot())

  - name: extensibility_demo
    description: Demonstrate recursive globbing, sandboxed exec, assertions, turn state, and YAML tool timeouts
    timeout_ms: 2500
    parameters:
      pattern:
        type: string
        description: Glob pattern to search within the workspace
        required: true
      cmd:
        type: string
        description: Executable to run without a shell
        required: true
      arg:
        type: string
        description: Optional single argument to pass to the executable
        required: false
      command_timeout_ms:
        type: number
        description: Optional command timeout in milliseconds
        required: false
    script: |
      def run(args):
          matches = fs.glob(args["pattern"])
          assert(len(matches) > 0, "no files matched: " + args["pattern"])
          state = ctx.get("demo_state", {"hook_tool": "missing"})
          command_args = []
          arg = string.trim(args.get("arg", ""))
          if arg != "":
              command_args = [arg]
          command = exec.run(args["cmd"], command_args, int(args.get("command_timeout_ms", 1000)))
          assert(command["ok"], "command failed: " + command["stderr"])
          stdout = string.trim(command["stdout"])
          ctx.set("demo_state", {
              "hook_tool": state.get("hook_tool", ""),
              "match_count": len(matches),
              "last_stdout": stdout,
          })
          return json.encode({
              "hook_tool": state.get("hook_tool", ""),
              "matches": len(matches),
              "first_match": matches[0],
              "stdout": stdout,
          })

  - name: validate_contact_payload
    description: Validate external input before using it in downstream workflows
    parameters:
      email:
        type: string
        description: Contact email address to validate
        required: true
      url:
        type: string
        description: Endpoint URL to validate
        required: true
      payload:
        type: string
        description: JSON payload string to validate
        required: true
    script: |
      def run(args):
          checks = {
              "email": validate.email(args["email"]),
              "url": validate.url(args["url"]),
              "json": validate.json(args["payload"]),
          }
          checks["ok"] = checks["email"] and checks["url"] and checks["json"]
          return json.encode(checks)

  - name: render_task_brief
    description: Render a task summary with deduplicated labels and nested placeholders
    parameters:
      title:
        type: string
        description: Task title
        required: true
      owner:
        type: string
        description: Task owner or team alias
        required: true
      priority:
        type: string
        description: Priority label to show in the brief
        required: true
      labels_csv:
        type: string
        description: Comma-separated labels to deduplicate and format
        required: false
    script: |
      def run(args):
          raw_labels = string.trim(args.get("labels_csv", ""))
          labels = []
          if raw_labels != "":
              labels = string.split(raw_labels, ",")
          labels = set.union(set.new(labels), ["owner:" + args["owner"], "priority:" + args["priority"]])
          return template.render(
              "Task: {{title}}\nOwner: {{owner}}\nPriority: {{meta.priority}}\nLabels: {{label_summary}}",
              {
                  "title": args["title"],
                  "owner": args["owner"],
                  "meta": {"priority": args["priority"]},
                  "label_summary": string.join(set.values(labels), ", "),
              },
          )

  - name: file_change_preview
    description: Copy a workspace file to scratch space, preview a diff, then move the staged copy
    parameters:
      source_path:
        type: string
        description: File to preview without editing in place
        required: true
      scratch_dir:
        type: string
        description: Workspace-local scratch directory for staged copies
        required: true
      append_text:
        type: string
        description: Text to append in the staged preview
        required: true
    script: |
      def run(args):
          fs.mkdir(args["scratch_dir"])
          staged = args["scratch_dir"] + "/preview.txt"
          archived = args["scratch_dir"] + "/final.txt"
          fs.copy(args["source_path"], staged)
          original = fs.read(args["source_path"])
          candidate = original + args["append_text"]
          preview = fs.diff(original, candidate, args["source_path"], archived)
          fs.write(staged, candidate)
          fs.move(staged, archived)
          return json.encode({
              "archived_path": archived,
              "archived_exists": fs.exists(archived),
              "preview": string.truncate(preview, 400),
          })

hooks:
  - event: tool.pre
    handler: demo_turn_state
    when: payload.get("name", "") == "extensibility_demo"
    script: |
      def handle(event, payload):
          ctx.set("demo_state", {"hook_tool": payload["name"]})
          return allow()

  - event: tool.pre
    handler: audit_log
    script: |
      def handle(event, payload):
          log("tool call: " + json.encode(payload))
          return allow()

  - event: tool.pre
    handler: secret_guard
    priority: 10
    script: |
      def handle(event, payload):
          encoded = json.encode(payload)
          if "password" in encoded or "secret" in encoded or "token" in encoded:
              return block("potential secret detected in tool arguments")
          return allow()

  - event: tool.pre
    handler: path_guard
    priority: 5
    script: |
      def handle(event, payload):
          # Block file operations with path traversal attempts
          encoded = json.encode(payload)
          if ".." in encoded and ("read_file" in encoded or "write_file" in encoded or "list_dir" in encoded or "file_info" in encoded):
              return block("path traversal detected — '..' not allowed in file paths")
          return allow()

  - event: delegate.pre
    handler: delegate_guard
    priority: 5
    script: |
      def handle(event, payload):
          if payload.get("task", "") == "":
              return block("delegation task cannot be empty")
          if len(payload.get("tools", [])) > 4:
              return block("delegation request is too large — keep delegate toolsets focused")
          return allow()

  - event: tool.pre
    handler: write_audit
    when: payload.get("name", "") == "write_file" or payload.get("name", "") == "append_file"
    script: |
      def handle(event, payload):
          log("write audit [" + uuid.v4() + "] " + payload["name"] + " on " + os.platform())
          return allow()

  - event: custom.audit.packet
    handler: packet_audit
    priority: 20
    script: |
      def handle(event, payload):
          payload["audit_count"] = metrics.incr("custom.audit.packet")
          payload["tenant_slug"] = string.lower(payload.get("tenant", ""))
          payload["signature_preview"] = string.truncate(payload.get("signature", ""), 12)
          return modify(payload)

  - event: delegate.post
    handler: delegate_audit
    script: |
      def handle(event, payload):
          log("delegate result: " + json.encode(payload))
          return allow()
