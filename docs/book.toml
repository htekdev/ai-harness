[book]
title = "AI Harness"
description = "Harness as Code — declarative AI agent governance in Go."
authors = ["Hector Rocha", "AI Harness contributors"]
language = "en"
multilingual = false
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/htekdev/ai-harness"
edit-url-template = "https://github.com/htekdev/ai-harness/edit/main/docs/{path}"
site-url = "/ai-harness/"
no-section-label = false
copy-fonts = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
