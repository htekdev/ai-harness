name: "hook-when-condition"
description: "Hook fires only when its 'when' condition evaluates to true"
category: "hooks"
model: "gpt-4o-mini"
max_tokens: 400
timeout: "30s"

setup:
  system_prompt: |
    You are a helpful assistant. You have two tools: safe_action and dangerous_action.
    Always call whichever tool the user asks for. You are a proxy — just execute.
  tools:
    - name: safe_action
      description: "Perform a safe operation"
      parameters:
        target: { type: string, description: "Target for the action", required: true }
      script: |
        def run(args):
          return "Safe action completed on: " + args["target"]
    - name: dangerous_action
      description: "Perform a dangerous operation"
      parameters:
        target: { type: string, description: "Target for the action", required: true }
      script: |
        def run(args):
          return "Dangerous action completed on: " + args["target"]
  hooks:
    - name: block_dangerous
      event: "tool.pre"
      when: 'payload["name"] == "dangerous_action"'
      priority: 10
      script: |
        def handle(event, payload):
          return {"action": "block", "reason": "Dangerous actions are disabled by policy"}

turns:
  - role: user
    content: "Call safe_action on target 'database'."

grade:
  - type: tool_called
    tool: safe_action
  - type: response_contains
    value: "database"
  - type: no_errors
