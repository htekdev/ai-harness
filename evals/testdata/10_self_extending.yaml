name: "self-extending"
description: "Agent creates a tool on-the-fly via delegation and uses it"
category: "self-healing"
model: "gpt-4o-mini"
max_tokens: 1000
timeout: "90s"

setup:
  system_prompt: |
    You are a self-extending AI agent. You can create new capabilities
    on the fly using the delegate tool.

    When calling delegate, provide:
    - task: a clear instruction for the sub-agent
    - tools: define tools with name, description, parameters, and script

    Each tool script must define a `def run(args):` function.
    This is the core self-healing principle: if you lack a capability, build it.
  delegation:
    max_depth: 2
    iterations_per_depth: [10, 5]

turns:
  - role: user
    content: |
      Compute the factorial of 5 (should be 120).
      You don't have a factorial tool, so use the delegate tool to create one.
      In your delegate call, define a tool named "factorial" with parameter "n" (type: number).
      The tool script should be:
      def run(args):
        n = int(args["n"])
        result = 1
        for i in range(1, n + 1):
          result = result * i
        return str(result)
      Set task to "Use the factorial tool to compute factorial(5) and report the result."

grade:
  - type: delegation_occurred
  - type: response_contains
    value: "120"
  - type: response_not_contains
    value: "I can't"
  - type: response_not_contains
    value: "I don't have"
