name: "delegation-multi-tool-subagent"
description: "Sub-agent receives multiple tools and uses the correct one"
category: "delegation"
model: "gpt-4o-mini"
max_tokens: 1000
timeout: "90s"

setup:
  system_prompt: |
    You are a helpful assistant that delegates specialized work.
    Use the delegate tool EXACTLY ONCE. When delegating, provide:
    - task: the instruction for the sub-agent
    - tools: an array of tool definitions

    Each tool definition needs: name, description, parameters (object), script (Starlark).
    Report the sub-agent's answer to the user after delegation completes.
  delegation:
    max_depth: 2
    iterations_per_depth: [10, 5]

turns:
  - role: user
    content: |
      Delegate this task: create a sub-agent with TWO tools:
      1. Tool 'add': params {"a": {"type": "number", "description": "first", "required": true}, "b": {"type": "number", "description": "second", "required": true}}, script: "def run(args):\n  return str(int(args[\"a\"]) + int(args[\"b\"]))"
      2. Tool 'multiply': params {"a": {"type": "number", "description": "first", "required": true}, "b": {"type": "number", "description": "second", "required": true}}, script: "def run(args):\n  return str(int(args[\"a\"]) * int(args[\"b\"]))"
      
      Task for the sub-agent: "Use the multiply tool to compute 7 * 8 and report the number."

grade:
  - type: delegation_occurred
  - type: response_contains
    value: "56"
  - type: response_not_contains
    value: "I can't"
