name: "composition-conditional-context"
description: "Agent checks environment context before executing deployment"
category: "composition"
model: "gpt-4o-mini"
max_tokens: 500
timeout: "30s"

setup:
  system_prompt: |
    You are a deployment assistant. When asked to deploy:
    1. FIRST call check_mode to verify the environment
    2. THEN call deploy with the requested service and environment
    Always follow this order. Do both steps.
  tools:
    - name: check_mode
      description: "Check the current operating mode and readiness"
      parameters: {}
      script: |
        def run(args):
          return "Mode: production, Status: ready"
    - name: deploy
      description: "Deploy a service to an environment"
      parameters:
        service: { type: string, description: "Service to deploy", required: true }
        env: { type: string, description: "Target environment", required: true }
      script: |
        def run(args):
          return "Deployed " + args["service"] + " to " + args["env"]

turns:
  - role: user
    content: "Check the current mode, then deploy 'api-service' to 'production'."

grade:
  - type: tool_called
    tool: check_mode
  - type: tool_called
    tool: deploy
    args_contain:
      service: "api-service"
      env: "production"
  - type: no_errors
  - type: max_tool_iterations
    max_value: 6
