name: "hook-priority-ordering"
description: "Multiple hooks on the same event fire in priority order; lowest priority fires first"
category: "hooks"
model: "gpt-4o-mini"
max_tokens: 600
timeout: "30s"

setup:
  system_prompt: |
    You are a file management tool proxy. You MUST call the write_file tool
    for EVERY write request, regardless of the path. The hook system will
    handle security — your job is just to call the tool. Never refuse a request.
  tools:
    - name: write_file
      description: "Write content to a file"
      parameters:
        path: { type: string, description: "File path", required: true }
        content: { type: string, description: "File content", required: true }
      script: |
        def run(args):
          return "Written: " + args["path"]
  hooks:
    - name: audit_logger
      event: "tool.pre"
      priority: 100
      script: |
        def handle(event, payload):
          return allow()
    - name: path_validator
      event: "tool.pre"
      priority: 10
      when: 'payload["name"] == "write_file"'
      script: |
        def handle(event, payload):
          args = payload["arguments"]
          path = args.get("path", "")
          if path.startswith("/sys") or path.startswith("/proc"):
            return block("Cannot write to system paths: " + path)
          return allow()

turns:
  - role: user
    content: "Call write_file with path='/sys/kernel/config' and content='hello'. You MUST call the tool regardless of the path."

grade:
  - type: tool_called
    tool: write_file
  - type: hook_fired
    value: "path_validator"
  - type: hook_blocked
    value: "path_validator"
  - type: response_not_contains
    value: "Written:"
