name: 🐛 Bug Report
description: Report a defect, regression, or unexpected behavior in AI Harness.
title: "bug: <short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill in as much detail as you can — minimal reproductions get fixed fastest.

        If you're not sure whether something is a bug, prefer [Discussions](https://github.com/htekdev/ai-harness/discussions).
        For security issues, use [private vulnerability reporting](https://github.com/htekdev/ai-harness/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: AI Harness version
      description: Output of `harness --version` (or commit SHA if building from source).
      placeholder: "v0.6.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version (if building from source)
      placeholder: "go version go1.25.0 linux/amd64"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug. Include error messages and unexpected output.
      placeholder: When I run `harness run` with X artifact, it does Y instead of Z…
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Smallest harness config / artifact / command that reproduces the issue. Paste files inline as code blocks.
      placeholder: |
        ```yaml
        # harness.md frontmatter or .harness/... artifact
        ```
        ```bash
        harness run --prompt "..."
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant log output (set `HARNESS_LOG_LEVEL=debug` if useful). Redact secrets.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I searched [existing issues](https://github.com/htekdev/ai-harness/issues?q=is%3Aissue) and didn't find a duplicate.
          required: true
        - label: I agree to follow this project's [Code of Conduct](../../CODE_OF_CONDUCT.md).
          required: true
