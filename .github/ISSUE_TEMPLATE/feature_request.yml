name: ✨ Feature Request
description: Propose a new capability, artifact, or harness primitive.
title: "feat: <short description>"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        AI Harness is biased toward a **minimal core + extensible edges**. Before proposing a core change, consider whether the idea fits as an artifact (tool, hook, sub-agent, policy) instead.

        For early-stage ideas you're still shaping, [Discussions](https://github.com/htekdev/ai-harness/discussions) is often the better venue.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who feels the pain today?
      placeholder: As an operator running governed agents, I can't currently…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like AI Harness to solve it? Sketch the user-facing surface (CLI, artifact frontmatter, hook event, etc.) if you can.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does this belong?
      description: Best guess — maintainers may reclassify during triage.
      options:
        - Core runtime
        - New artifact type
        - New tool
        - New hook event
        - New sub-agent capability
        - Policy / governance
        - CLI / DX
        - Docs
        - Observability (logs, OTel, audit)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered (including "do nothing") and why this proposal is better.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to prior issues, related artifacts, or external references (e.g. how Pi or other harnesses handle this).
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I searched [existing issues](https://github.com/htekdev/ai-harness/issues?q=is%3Aissue) and didn't find a duplicate.
          required: true
        - label: I agree to follow this project's [Code of Conduct](../../CODE_OF_CONDUCT.md).
          required: true
